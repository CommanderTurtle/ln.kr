<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>ln.kr · opening document</title>
  <style>
    body { margin: 0; display: grid; min-height: 100vh; place-items: center; background: #111512; color: #dce7de; font: 16px system-ui, sans-serif; }
  </style>
</head>
<body>
  <p>Opening ln.kr document…</p>
  <script>
    const marker = "/T/";
    const markerIndex = location.pathname.toUpperCase().indexOf(marker);
    if (markerIndex >= 0) {
      const base = location.pathname.slice(0, markerIndex + 1);
      const payload = location.pathname.slice(markerIndex + marker.length);
      location.replace(`${base}#q:${encodeURIComponent(payload)}`);
    } else {
      const base = location.pathname.replace(/[^/]*$/, "");
      location.replace(base || "/");
    }
  </script>
</body>
</html>
